<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body>
    <header>
        <!-- Logo  -->
        <div class="logo">
            <img class="logo-img" src="/img/logo.jpg" alt="">
            <span>Du code, de la reussite</span>
        </div>
        <!-- Navigation -->
        <nav class="menu">
            <ul>
                <li><a href="/index.html">Acceuil</a></li>
                <li><a href="#Pages/cours.html">Cours</a></li>
                <li><a href="#Pages/exercices.html">Exercices</a></li>
                <li><a href="#Pages/ressources.html">Ressources</a></li>
                <li><a href="/Pages/contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Entete page -->
    <section class="entete-page">
        <h1>Contactez nous</h1>
        <p>Une question ? un projet ? Ecrivez nous nous repondons sous 24h</p>
    </section>
    <!-- contenue principal -->
    <main>
        <div class="form-contact">
            <form class="formulaire" action="#" method="post">
                <div class="champ">
                    <label for="nom">Nom complet</label>
                    <input type="text" name="nom" id="nom">
                </div>

                <div class="champ">
                    <label for="email">Adresse Mail</label>
                    <input type="email" name="email" id="email">
                </div>

                <div class="champ">
                    <label for="telephone">Telephone</label>
                    <input type="tel" name="telephone" id="telephone">
                </div>

                <div class="champ">
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>
                </div>

                <button type="submit" class="btn">Envoyer le message</button>
            </form>
        </div>
    </main>

    <!--Pied de page-->
    <footer>
        <div class="f-text">&copy; 2026 - LABO ACADEMIQUE - Tous droits reserves</div>
        <div class="f-text">Contact : contact@laboacademy.fr | Suivez-nous sur <a href="https://">Linkdin</a> et <a
                href="https://">GitHub</a></div>
    </footer>
</body>

</html>
